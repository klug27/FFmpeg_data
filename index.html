<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Convertisseur Vidéo → RGB</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="style.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Préchargement FFmpeg -->
  <link rel="preload" href="/ffmpeg/ffmpeg-core.js" as="script">
  <link rel="preload" href="/ffmpeg/ffmpeg-core.wasm" as="fetch" type="application/wasm" crossorigin>
  <link rel="preload" href="/ffmpeg/ffmpeg-core.worker.js" as="script">
</head>
<body>
  <div class="container text-center mt-5">
    <h1>🎥 Convertisseur Vidéo → RGB brut</h1>

    <!-- Sélection de fichier vidéo -->
    <input type="file" id="videoInput" accept="video/*" class="form-control mb-3">

    <!-- Paramètres facultatifs -->
    <input type="number" id="fpsInput" class="form-control mb-3" placeholder="FPS (facultatif)">
    <div class="row mb-3">
      <div class="col">
        <input type="number" id="widthInput" class="form-control" placeholder="Largeur (facultatif)">
      </div>
      <div class="col">
        <input type="number" id="heightInput" class="form-control" placeholder="Hauteur (facultatif)">
      </div>
    </div>

    <!-- Boutons -->
    <button id="convertVideoBtn" class="btn btn-primary w-100 mb-3">Convertir en .RGB</button>
    <button id="cancelBtn" class="btn btn-outline-danger w-100 mb-3">⛔ Annuler la conversion</button>

    <!-- Spinner circulaire -->
    <div id="spinner" class="d-none text-center mb-3">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Chargement...</span>
      </div>
    </div>

    <!-- Barre de progression -->
    <div class="progress d-none" id="progressContainer">
      <div class="progress-bar bg-primary progress-bar-striped progress-bar-animated" id="progressBar" style="width: 0%">0%</div>
    </div>

    <!-- Lien de téléchargement -->
    <a id="downloadLink" class="btn btn-success mt-3 d-none" download="converted.rgb">📥 Télécharger RGB</a>

    <!-- Log d’état -->
    <p id="log" class="mt-3 text-muted small"></p>
  </div>

  <script src="/ffmpeg/ffmpeg.js"></script>
  <script src="config.js"></script>
</body>
</html>
